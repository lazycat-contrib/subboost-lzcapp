version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/subboost.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: app

build:
  run_buildscript: false

images:
  - id: app
    target: service
    service: app
    source: ghcr.io/subboost/subboost
    channel: stable
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: SubBoost
    summary: "Clash/Mihomo subscription conversion and management tool"
